[package]
name = "sharecopy"
version = "0.1.0"
description = "Cross-platform LAN clipboard sharing tool"
authors = ["mao"]
license = "MIT"
repository = "https://github.com/mao/sharecopy"
edition = "2021"
rust-version = "1.80.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1.52.3", features = ["full"] }
mdns-sd = "0.20.0"

bincode = "1.3.3"
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.20.0", features = ["v4"] }
image = "0.25.6"
base64 = "0.22.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
parking_lot = "0.12.5"
dashmap = "6.2.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
directories = "6.0.0"
toml = "1.0.7"
hostname = "0.4.2"
if-addrs = "0.15.0"
open = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Release 优化：减小 Android APK 体积
[profile.release]
opt-level = "z"     # 激进优化体积（比 s 更小）
lto = true          # 链接时优化
codegen-units = 1   # 更好的优化效果
strip = true        # 去除所有符号
panic = "abort"     # 移除 panic unwind 开销，减小体积
