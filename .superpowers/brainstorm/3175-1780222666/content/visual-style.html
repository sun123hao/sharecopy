<h2>哪种 Apple 风格更合适？</h2>
<p class="subtitle">Apple 设计语言有几种典型表达方式，选择一种作为主基调</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>极简白 + 大字体</h3>
      <p>纯白背景，超大 SF 风格标题，大量留白，渐变文字点缀。类似 Apple 产品页面（iPhone/Mac）的极致简约。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>深色科技感</h3>
      <p>深色背景为主，配合发光效果、毛玻璃卡片、渐变色块。更有"技术工具"的酷感，类似 Apple 开发者页面。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>柔和渐变 + 毛玻璃</h3>
      <p>柔和彩色渐变背景，大面积毛玻璃卡片（backdrop-blur），圆润元素。类似 iOS 控制中心 / Apple Music 的现代感。</p>
    </div>
  </div>
</div>
