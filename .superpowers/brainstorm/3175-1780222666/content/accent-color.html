<h2>选一个主点缀色</h2>
<p class="subtitle">这个颜色会用在按钮、链接、图标强调等关键交互元素上</p>

<div class="cards">
  <div class="card" data-choice="blue" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #007AFF, #5856D6); height:120px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; font-weight:600;">
      #007AFF<br>经典蓝
    </div>
    <div class="card-body">
      <h3>Apple 经典蓝</h3>
      <p>iOS/macOS 原生蓝色，可靠、专业、经典。最"Apple"的选择。</p>
    </div>
  </div>
  <div class="card" data-choice="purple" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #AF52DE, #5E5CE6); height:120px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; font-weight:600;">
      #AF52DE<br>科技紫
    </div>
    <div class="card-body">
      <h3>科技紫</h3>
      <p>现代、创新感强，适合突出"跨设备连接"的技术属性。</p>
    </div>
  </div>
  <div class="card" data-choice="teal" onclick="toggleSelect(this)">
    <div class="card-image" style="background: linear-gradient(135deg, #5AC8FA, #34C759); height:120px; border-radius:16px; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; font-weight:600;">
      #5AC8FA → #34C759<br>青绿渐变
    </div>
    <div class="card-body">
      <h3>青绿渐变</h3>
      <p>清新、流畅，像数据传输的视觉隐喻。接近 ShareCopy 现有图标的绿色系。</p>
    </div>
  </div>
</div>
