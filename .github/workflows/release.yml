name: 构建发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ── macOS 构建 ──────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - name: 安装依赖
        run: npm ci

      - name: 构建 (Tauri)
        env:
          CI: 'true'
        run: |
          npm run tauri build -- --target ${{ matrix.target }}-apple-darwin

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-macOS-${{ matrix.target }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg

      - name: 创建 Release (仅 tag 推送)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/**/release/bundle/dmg/*.dmg

  # ── Windows 构建 ────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: npm ci

      - name: 构建 (Tauri)
        run: npm run tauri build

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-Windows
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: 创建 Release (仅 tag 推送)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/msi/*.msi

  # ── Android 构建 (debug) ──────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 Android Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK（使用 runner 预装）
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || true

      - name: 安装依赖
        run: npm ci

      - name: 恢复签名密钥
        run: |
          mkdir -p src-tauri/gen/android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/app/keystore/release.keystore
          cat > src-tauri/gen/android/app/keystore/keystore.properties << 'PROPEOF'
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPEOF

      - name: 构建 (Tauri Android Debug)
        run: npx tauri android build --debug

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-Android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk

  # ── Android 构建 (release, 仅 tag) ────────
  build-android-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 Android Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK（使用 runner 预装）
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" || true

      - name: 安装依赖
        run: npm ci

      - name: 恢复签名密钥
        run: |
          mkdir -p src-tauri/gen/android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > src-tauri/gen/android/app/keystore/release.keystore
          cat > src-tauri/gen/android/app/keystore/keystore.properties << 'PROPEOF'
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPEOF

      - name: 构建 (Tauri Android Release)
        run: npm run tauri android build

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
