name: 构建发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ── macOS 构建 ──────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - name: 安装依赖
        run: npm ci

      - name: 构建 (Tauri)
        env:
          CI: 'true'
        run: |
          npm run tauri build -- --target ${{ matrix.target }}-apple-darwin

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-macOS-${{ matrix.target }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg

      - name: 创建 Release (仅 tag 推送)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/**/release/bundle/dmg/*.dmg

  # ── Windows 构建 ────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: npm ci

      - name: 构建 (Tauri)
        run: npm run tauri build

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-Windows
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: 创建 Release (仅 tag 推送)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/msi/*.msi
