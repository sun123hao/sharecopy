name: 构建发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ── macOS 构建 ──────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - name: 安装依赖
        run: npm ci

      - name: 构建 (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}-apple-darwin
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'ShareCopy v__VERSION__'
          releaseBody: '详见 CHANGELOG'
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false

      - name: 代码签名 (ad-hoc)
        run: |
          # 对 .app 内所有二进制文件进行 ad-hoc 签名
          BUNDLE_DIR=$(find src-tauri/target -path "*/release/bundle/macos" -type d 2>/dev/null | head -1)
          if [ -d "$BUNDLE_DIR" ]; then
            APP=$(find "$BUNDLE_DIR" -name "*.app" -type d | head -1)
            if [ -n "$APP" ]; then
              echo "签名: $APP"
              codesign --force --deep --sign - "$APP"
            fi
          fi

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-macOS-${{ matrix.target }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg

  # ── Windows 构建 ────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: npm ci

      - name: 构建 (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ShareCopy-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
